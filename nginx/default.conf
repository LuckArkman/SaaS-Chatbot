# ============================================================
# default.conf — Virtual Host Principal (SaaS Chatbot)
# ============================================================

# ── HTTP → HTTPS Redirect ──────────────────────────────────
server {
    listen 80;
    server_name _;

    # Health check interno do Docker (não redireciona para HTTPS)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Todo o resto redireciona para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Principal ────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # ── SSL ─────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Segurança: Headers de Resposta ─────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-XSS-Protection         "1; mode=block"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"       always;

    # ── Limite de conexões simultâneas por IP ───────────────
    limit_conn conn_limit 100;

    # ── Health Check (usado pelo Docker e monitoramento) ────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Rota de Login — Rate Limit Rigoroso ─────────────────
    # Protege contra força bruta mesmo que o account-lockout no Node.js esteja
    # desativado. 5 req/min com burst de 3 sem atraso.
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://saas_api_backend/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;

        # Resposta customizada para rate limit atingido
        proxy_intercept_errors on;
        error_page 429 @too_many_requests;
    }

    # ── Upload de Mídias — Rate Limit e Timeout Aumentado ──
    location /api/v1/storage/upload {
        limit_req  zone=upload_limit burst=20 nodelay;

        proxy_pass         http://saas_api_backend/api/v1/storage/upload;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # Timeout maior para uploads grandes
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;   # 2 min para uploads lentos
        proxy_send_timeout     120s;

        client_max_body_size   100m;   # Permite vídeos/documentos grandes
    }

    # ── WebSockets — Chat em Tempo Real ─────────────────────
    location /api/v1/ws {
        proxy_pass         http://saas_api_backend/api/v1/ws;
        proxy_http_version 1.1;

        # Headers obrigatórios para upgrade WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos — conexões WS ficam abertas horas
        # O keepalive (ping a cada 25s no Node.js) mantém o tráfego ativo
        proxy_read_timeout    3600s;   # 1 hora
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Sem buffer para WebSockets (latência zero)
        proxy_buffering off;
    }

    # ── API REST — Rotas Gerais ──────────────────────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://saas_api_backend/api/v1/;
        proxy_http_version 1.1;

        # Reutiliza conexões keepalive com o upstream
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Timeouts balanceados para a API
        proxy_connect_timeout  5s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # Buffering de resposta (melhora performance com respostas grandes)
        proxy_buffer_size          16k;
        proxy_buffers              8 32k;
        proxy_busy_buffers_size    64k;

        # Retenta em caso de erro de gateway (resiliência)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # ── Arquivos de Mídia — Cache no Nginx ──────────────────
    # Evita que a API Node.js seja chamada a cada request de imagem/áudio/vídeo
    location /uploads/ {
        proxy_pass http://saas_api_backend/uploads/;
        proxy_set_header Host $host;

        # Cache das mídias no cliente por 7 dias (URLs têm UUID único → cache-safe)
        expires       7d;
        add_header    Cache-Control "public, immutable";
        add_header    Vary Accept-Encoding;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Frontend ─────────────────────────────────────────────
    location / {
        proxy_pass         http://saas_ui_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Erros Customizados ───────────────────────────────────
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","detail":"Muitas tentativas. Aguarde antes de tentar novamente."}';
    }

    # Bloqueia acesso a arquivos ocultos (ex: .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
