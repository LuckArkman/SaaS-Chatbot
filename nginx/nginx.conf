# ============================================================
# nginx.conf — Configuração Global do Nginx (SaaS Chatbot)
# ============================================================
# Foco: Performance, Segurança e Resiliência para produção.
# ============================================================

user  nginx;

# Usa todos os cores disponíveis automaticamente
worker_processes  auto;

# Aumenta o limite de descritores de arquivos por worker
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Aceita múltiplas conexões por evento (alta performance em Linux)
    use epoll;
    multi_accept on;

    # Conexões simultâneas por worker (worker_processes × worker_connections = total)
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Formato de Log com informações de performance ──────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance de I/O ─────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;   # Envia headers e início do body num único pacote TCP
    tcp_nodelay     on;   # Reduz latência em conexões keep-alive

    # ── Timeouts ───────────────────────────────────────────────────────────
    keepalive_timeout       75s;   # Tempo de keep-alive HTTP (padrão nginx é 75)
    keepalive_requests      1000;  # Requisições por conexão keep-alive antes de fechar
    client_header_timeout   15s;
    client_body_timeout     30s;
    send_timeout            30s;

    # ── Limites de upload (compatível com envio de mídias do WhatsApp) ─────
    client_max_body_size    100m;
    client_body_buffer_size 128k;

    # ── Compressão Gzip ────────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     5;        # Equilíbrio CPU/tamanho (1=rápido, 9=máximo)
    gzip_buffers        16 8k;
    gzip_http_version   1.1;
    gzip_min_length     256;      # Não comprime responses pequenas (overhead maior que ganho)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate Limiting (Proteção contra DDoS e Brute-Force por IP) ─────────
    # Define zonas de memória compartilhada entre workers
    # 10m = ~160.000 endereços IP em memória
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login_limit:5m rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload_limit:5m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Segurança: Headers HTTP globais ────────────────────────────────────
    # Oculta a versão do Nginx (não expõe informações para atacantes)
    server_tokens off;

    # ── Upstream: Pool de conexões com a API Node.js ───────────────────────
    upstream saas_api_backend {
        server saas_api:8000;

        # Mantém pool de conexões TCP abertas com o backend (evita handshake a cada request)
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream saas_ui_backend {
        server saas_ui:8081;
        keepalive 16;
    }

    # Carrega os virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
